[project]
name = "eve-tts"
version = "0.1.0"
description = "Eve's local voice for 🔊 Listen: Kokoro-82M on MLX (Apple GPU), served on 127.0.0.1"
requires-python = "==3.12.*"
dependencies = [
  "mlx-audio==0.5.7",
  "misaki[en]==0.9.4",
  "soundfile==0.14.0",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[tool.uv]
package = false
# Dependencies at least two weeks old when locked (CLAUDE.md "Dependencies").
exclude-newer = "2026-10-05T00:00:00Z"
